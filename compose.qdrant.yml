services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in your shell; do not commit it.}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:6333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped

  embedding:
    build:
      context: .
      dockerfile: Dockerfile.embedding
    environment:
      HF_HOME: /models/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${HF_MODEL_CACHE:?Set HF_MODEL_CACHE to the pre-populated local Hugging Face cache}:/models/huggingface:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    mem_limit: 4g
    cpus: 2.0
    restart: unless-stopped

volumes:
  qdrant_storage:
