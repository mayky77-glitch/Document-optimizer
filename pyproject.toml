[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "document-optimizer"
version = "1.0.0"
description = "Детерминированная обработка, сопоставление и аудит строительных отчётов"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Project Team" }]
dependencies = [
  "duckdb>=1.2,<2",
  "openpyxl>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0.2,<7",
  "starlette>=0.47,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3",
  "ruff>=0.9",
]
rag = [
  "sentencepiece>=0.2,<1",
  "torch>=2.6,<3",
  "transformers>=4.48,<5",
]

[project.scripts]
report-processor = "report_processor.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"report_processor.admin_panel" = ["assets/*.css", "assets/*.html", "assets/*.js"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "contract: public API and serialization contract tests",
  "integration: multi-component integration tests",
  "slow: resource-intensive performance tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
