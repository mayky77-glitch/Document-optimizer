[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "document-optimizer"
version = "0.8.0"
description = "Поэтапная обработка строительных отчётов; блоки 1–8 — от инвентаризации до нормализации"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Project Team" }]
dependencies = ["duckdb>=1.2,<2", "openpyxl>=3.1,<4", "pyyaml>=6.0.2,<7"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
report-processor = "report_processor.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "contract: public API and serialization contract tests",
  "integration: multi-component integration tests",
  "slow: resource-intensive performance tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
