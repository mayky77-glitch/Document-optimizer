quality_control_contracts:
  public_api: "evaluate_quality_control(match_results, calculation_results, rule_set) -> QualityControlReport"
  cardinality: "exactly one CalculationResult for each MatchResult by result_id == match_result_id"
  tolerance_source: "rule_set.defaults.cost_tolerance_ratio; never hardcode or accept a second independent value"
  decision_precedence:
    - BLOCK_WRITE
    - REQUIRE_MANUAL_REVIEW
    - ALLOW_WRITE_WITH_WARNINGS
    - ALLOW_WRITE
  tolerance_formula: "abs(calculated_cost - selected_cost) / abs(selected_cost)"
  zero_tolerance_policy: "when selected_cost is zero, only calculated zero passes"
  tolerance_missing_policy: "missing target selected cost is an empty destination and skips comparison"
  totals_policy: "category sums and trace totals must exactly equal CalculationResult totals"
  numeric_policy: "finite Decimal only; no float, epsilon or hidden rounding"
  unit_policy: "compare normalized units; no conversion"
  order_policy: "input order ignored; multiplicity preserved; results and issues deterministically sorted"
  privacy_policy: "do not copy raw cell values, formula text or document content into the report"
write_decisions:
  ALLOW_WRITE:
    severity: none
  ALLOW_WRITE_WITH_WARNINGS:
    severity: warning
  REQUIRE_MANUAL_REVIEW:
    severity: manual_review
  BLOCK_WRITE:
    severity: blocking
issue_codes:
  blocking:
    - INPUT_EMPTY
    - DUPLICATE_IDENTITY
    - CARDINALITY_MISMATCH
    - IDENTITY_MISMATCH
    - MISSING_REQUIRED_VALUE
    - TARGET_NOT_WRITABLE
    - FORMULA_WITHOUT_CACHE
    - UNTRUSTED_FORMULA_CACHE
    - EXCEL_ERROR
    - VALUE_READ_FAILED
    - MISSING_PROVENANCE
    - PROVENANCE_CONFLICT
    - TOTAL_DISCREPANCY
    - TRACE_MISMATCH
    - FORMULA_MISMATCH
    - NO_VALUES
  manual_review:
    - UNMATCHED
    - AMBIGUOUS
    - MISSING_WORK_NAME
    - MISSING_UNIT
    - UNIT_CONFLICT
    - TOLERANCE_EXCEEDED
    - SOURCE_ROW_REUSED
    - QUANTITY_COST_INCONSISTENT
    - SIGN_CONFLICT
  warning:
    - NEGATIVE_VALUE
    - UPSTREAM_WARNING
public_models:
  QualityLocation: "source_kind, source_id, sheet_name, row_number, coordinate"
  QualityIssue: "issue_id, code, severity, message, target_row_id, match_result_id, calculation_id, source_row_ids, locations, evidence"
  QualityControlSummary: "match_count, calculation_count, matched_count, ambiguous_count, unmatched_count, calculated_count, warning_issue_count, manual_review_issue_count, blocking_issue_count"
  QualityControlReport: "report_id, input_digest, rule_set_hash, decision, issues, summary, match_result_ids, calculation_ids, contract_version"
identity_contracts:
