  contract: ExcelWriterContract-15.0
  target_input: TargetReport-9.0
  calculation_input: CalculationContract-13.0
  decision_input: QualityControlContract-14.0
  result_output: WriteResult-15.0
public_api: "write_target_report(source_path, output_path, decision, calculation_results, target_schema) -> WriteResult"
public_models:
  WriteStatus: "WRITTEN, SKIPPED_DECISION"
  WrittenCell: "calculation_id, target_row_id, sheet_name, row_number, coordinate, logical_column, decimal_text"
  WriteResult: "write_id, status, decision, source_file_id, source_sha256, output_path, output_sha256, written_cells, calculation_ids, warnings, contract_version"
decision_contract:
  ALLOW_WRITE: write
  ALLOW_WRITE_WITH_WARNINGS: "write and add QUALITY_GATE_WARNINGS_PRESENT"
  REQUIRE_MANUAL_REVIEW: "return SKIPPED_DECISION; never create or change output"
  BLOCK_WRITE: "return SKIPPED_DECISION; never create or change output"
write_contract:
  allowed_columns:
    CURRENT_PERIOD_QUANTITY: CalculationResult.quantity
    CURRENT_PERIOD_COST: CalculationResult.cost
  calculation_statuses:
    - calculated
    - calculated_with_warnings
  none_policy: "None is not written and never clears a cell"
  numeric_policy: "finite Decimal only; format(value, 'f'); never float, round, quantize or recalculate"
  target_policy: "writable row, exact schema binding, matching row/coordinate and raw lexeme, no formula, no merged target, existing style"
  duplicate_policy: "reject duplicate calculation_id, target_row_id or output coordinate"
  empty_policy: "reject empty calculations or a plan with no non-None values for writable decisions"
preservation_contract:
  method: "targeted OOXML worksheet-cell update; do not use openpyxl.save"
  package_entries: identical
  unchanged_parts: byte-identical
  formulas: "all formula elements, attributes, text, cached lexemes and calc properties unchanged"
  formatting: "styles, themes, drawings, relationships, comments, merged ranges, filters, panes, dimensions and sheet metadata unchanged"
  structure: "no rows, columns, sheets, merges or formulas created, deleted or moved"
  supported_format: ".xlsx only; signed OOXML and .xlsm rejected"
identity_contract:
  source: "regular .xlsx; actual SHA-256, size, source_file_id and filename equal TargetReportSchema"
  output: "different resolved path, .xlsx, absent before publication, never overwritten"
  source_recheck: "inode/device, size, mtime_ns and SHA-256 unchanged immediately before publish"
  write_id: "SHA-256 canonical JSON of contract, decision, source identity, sorted calculation IDs, sorted WrittenCell metadata and output SHA-256"
atomic_contract:
  - "create temp in output directory"
  - "write complete package and fsync temp"
  - "test package, reopen formula view, verify exact values and preservation"
  - "recheck source identity"
  - "publish no-clobber through hard link"
  - "unlink temp and fsync output directory"
  - "hash and reopen published output"
  - "on failure remove temp; never touch source or existing output"
error_codes:
  - INVALID_SOURCE
  - INVALID_OUTPUT_EXTENSION
  - OUTPUT_EXISTS
  - SOURCE_OUTPUT_IDENTITY
  - INVALID_SCHEMA_STATUS
