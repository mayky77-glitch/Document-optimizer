report_contract:
  audit_bundle: "run identity, controlled stage/event summaries, artifact hashes, counts and report refs"
  run_report: "deterministic run/stage status, controlled warnings/errors and counts"
  trace_report: "write_id -> calculation_id -> trace_id -> match_result_id -> candidate_id/source_row_id links without values or formulas"
  corrections: "new linked events; historical events remain immutable"
export_contract:
  formats:
    - JSON
    - JSONL
    - CSV
  deterministic: "canonical UTF-8, LF, fixed field order, stable sort; same SQLite snapshot produces byte-identical files regardless of input order"
  prepare: "write private temp files, flush, fsync, hash and reopen"
  verify: "parse, validate allowlist/schema/count/hash from one stable read snapshot"
  publish: "atomic hard-link no-clobber; never replace destination; fsync destination directory"
  cleanup: "success and failure leave no temp residue"
