  stage_attempt_id: "SHA-256 of AuditIdentity-16.0, run_id, controlled stage code and positive attempt number"
event_contract:
  ordering: "strict positive event_sequence unique with run_id"
  append_only: "UPDATE and DELETE denied by SQLite triggers; corrections are new events"
  chain: "event_hash = SHA-256 canonical envelope including previous_event_hash; first previous hash is fixed genesis"
  transitions: "controlled stage/state transition table validated before commit"
  transaction: "sequence uniqueness, transition validation, previous hash and new event commit in one IMMEDIATE transaction"
  saga_states:
    - PENDING
    - DATA_COMMITTED
    - EXPORT_PREPARED
    - EXPORT_VERIFIED
  integrity_blockers:
    - HASH_CHAIN_INVALID
    - SEQUENCE_GAP
    - INVALID_STAGE_TRANSITION
    - SNAPSHOT_CHANGED
    - EXPORT_HASH_MISMATCH
    - EXPORT_DESTINATION_EXISTS
