[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-to-tad"
version = "16.0.0"
description = "Кроссплатформенный конвертер XLSX/XLSM/XLSB в Parquet и Tad"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "openpyxl>=3.1",
    "pyxlsb>=1.0",
]

[project.scripts]
excel-to-tad = "excel_to_tad.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["excel_to_tad*"]
